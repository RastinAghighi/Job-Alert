# Phase 0 CI (spec §32).
#
# The toolchain version is deliberately NOT named in this file.
# rust-toolchain.toml is the single source of truth; `rustup show` installs
# whatever it pins. Naming a version here too would let the two drift.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch — a 1-minute-cadence project does
# not need to pay for stale CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail fast and keep logs small; this repo's logs are read, not skimmed.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        # Reads rust-toolchain.toml and installs the channel, profile,
        # components and targets it names.
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
          cargo --version
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        # --all-targets extends the gate to tests, benches and examples, which
        # a bare `cargo clippy` would skip. From Phase 1 on, most of the code
        # that defends the §6 invariants lives in test targets.
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace --all-features

      - name: cargo doc
        # The §17 crate contracts live in doc comments. Broken intra-doc links
        # mean the architecture documentation has silently rotted.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

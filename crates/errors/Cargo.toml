[package]
name         = "jobmon-errors"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true

[lints]
workspace = true

# §9/§17: this crate is the dependency leaf. It may depend on nothing but `std`
# and `serde` — an edge to `jobmon-core` would be a cycle, because `core`
# re-exports `SourceId` from here.
[dependencies]
serde.workspace = true

# Tests only. The §13.2.3 wire names are durable schema, so `as_str()` and the
# serde representation are asserted equal rather than assumed equal; that needs a
# serde format. `serde_json` must NOT become a real dependency of this crate.
[dev-dependencies]
serde_json.workspace = true
